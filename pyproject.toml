[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "manager-watch"
version = "0.1.0"
description = "Automated monitoring + deterministic research pipeline for Motherwell F.C. managerial appointments"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "tenacity>=8.2",
    "beautifulsoup4>=4.12",
    "lxml>=5.0",
    "feedparser>=6.0",
    "mwparserfromhell>=0.6",
    "rapidfuzz>=3.0",
    "APScheduler>=3.10,<4",
    "SQLAlchemy>=2.0",
    "alembic>=1.13",
    "psycopg[binary]>=3.1",
    "Jinja2>=3.1",
    "jsonschema>=4.21",
    "pydantic-settings>=2.2",
    "structlog>=24.1",
    "typer>=0.12",
    "PyYAML>=6.0",
    "python-dateutil>=2.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "respx>=0.21",
]

[project.scripts]
manager-watch = "manager_watch.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
manager_watch = ["output/schema/*.json", "output/templates/*.j2"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
